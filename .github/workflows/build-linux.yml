name: build-linux

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-linux.yml'
  tags: [ 'v*' ]

permissions:
  contents: write

concurrency:
  group: build-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      DROGON_VERSION: v1.9.10
      DROGON_PREFIX: ${{ github.workspace }}/.deps/drogon
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git ca-certificates pkg-config \
            libsqlite3-dev libspdlog-dev libfmt-dev libjsoncpp-dev nlohmann-json3-dev \
            zlib1g-dev libssl-dev libc-ares-dev uuid-dev \
            libgif-dev libpng-dev libjpeg-dev liblua5.4-dev

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Drogon (static, v1.9.10)
        id: drogon-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.DROGON_PREFIX }}
          key: drogon-${{ env.DROGON_VERSION }}-ubuntu2404-static-v1

      - name: Build Drogon from source
        if: steps.drogon-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$DROGON_VERSION" --recurse-submodules --shallow-submodules \
            https://github.com/drogonframework/drogon.git /tmp/drogon
          cmake -S /tmp/drogon -B /tmp/drogon/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$DROGON_PREFIX" \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_C-ARES=ON -DOPENSSL_USE_STATIC_LIBS=ON \
            -DBUILD_EXAMPLES=OFF -DBUILD_CTL=OFF -DBUILD_ORM=OFF \
            -DMYSQL_SUPPORT=OFF -DLIBPQ_SUPPORT=OFF
          grep -q 'trantor/net/inner/AresResolver.cc' /tmp/drogon/build/build.ninja \
            || { echo 'trantor c-ares not enabled' >&2; exit 1; }
          cmake --build /tmp/drogon/build -j"$(nproc)"
          cmake --install /tmp/drogon/build

      - name: Configure insoulforge
        run: |
          cmake -S . -B build-cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$DROGON_PREFIX" \
            -DBUILD_TESTING=OFF

      - name: Build insoulforge
        run: cmake --build build-cmake -j"$(nproc)"

      - name: Package
        run: |
          VER=$(sed -n 's/^project(insoulforge VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "VERSION=$VER" >> "$GITHUB_ENV"
          rm -rf dist && mkdir -p dist
          cp -a build/insoulforge dist/insoulforge
          cp -a agentTools dist/insoulforge/agentTools
          tar -C dist -czf "dist/insoulforge-$VER-linux-x64.tar.gz" insoulforge
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: insoulforge-linux-x64
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Publish release asset (ci-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-latest
          name: insoulforge ci build (${{ env.VERSION }})
          prerelease: true
          make_latest: false
          files: dist/*.tar.gz
          body: |
            Automated Linux x64 build from ${{ github.sha }}.
            Generated by .github/workflows/build-linux.yml (no Docker).
